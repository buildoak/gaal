# Gaal configuration — agent session observability
# Copy to ~/.gaal/config.toml if you want to override built-in defaults.
# Core indexing and query commands work without agent-mux.

# Default output directory for session markdown files (used by `gaal index backfill`).
# When set, backfill writes markdowns here without needing --output-dir.
# markdown_output_dir = "/path/to/session/markdowns/"

[llm]
# Default engine for LLM operations (codex, claude)
default_engine = "codex"
# Default model identifier (via agent-mux: --engine codex --model gpt-5.4-mini)
default_model = "gpt-5.4-mini"
# Timeout in seconds for LLM invocations
timeout_secs = 120

[handoff]
# Path to extraction prompt (relative to ~/.gaal/)
prompt = "prompts/handoff.md"
# Output format identifier
format = "eywa-compatible"

[agent-mux]
# Optional binary name or absolute path used by `gaal create-handoff`.
# Agent-mux is not required for indexing, search, inspect, or transcript commands.
path = "agent-mux"
# Optional dispatch profile passed to agent-mux with -P when your install provides one.
timeout_secs = 120
# effort = "xhigh"
# Override cwd for dispatch when the default session cwd is not suitable.
# cwd = "/path/to/project/with/skills"

[stuck]
# Seconds of silence before a session is considered stuck
silence_secs = 300
